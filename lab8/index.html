<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja DEISI</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="images/deisi-ball.png">
</head>
<body>
  <header>
    <img src="images/deisi-inverse.svg" alt="DEISI Lusófona Informática" id="logo">
    <h1>Loja DEISI</h1>
    <nav>
      <ul>
        <li><a href="#secao-produtos">Produtos</a></li>
        <li><a href="#secao-cesto">Cesto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="secao-produtos">
      <h2>Selecione os seus Produtos</h2>

      <div id="filtros">
        <label>Filtrar
          <select id="categorias">
            <option value="">Todas as categorias</option>
          </select>
        </label>

        <label>Ordenar
          <select id="ordenar">
            <option value="">Ordenar pelo preço</option>
            <option value="desc">Preço Decrescente</option>
            <option value="asc">Preço Crescente</option>
          </select>
        </label>

        <label>Procurar
          <input type="text" id="pesquisa" placeholder="pesquise por produto">
        </label>
      </div>

      <div id="produtos"></div>
    </section>

    <section id="secao-cesto">
      <h2>Produtos Selecionados</h2>
      <div id="cesto"></div>
        <div id="resumo">
            <p id="total">Custo total: 0.00 €</p>

            <div id="checkout">
                <label>És estudante do DEISI?
                    <input type="checkbox" id="estudante">
                </label>
                <label>Cupão de desconto:
                    <input type="text" id="cupao">
                </label>
                <button id="comprar">Comprar</button>
                <p id="resposta-compra"></p>
            </div>
        </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Loja DEISI — Todos os direitos reservados.</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
