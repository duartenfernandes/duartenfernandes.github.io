<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <ol>
        <li><span id="passa" onmouseover="entra()" onmouseout="sai()">Passe aqui!</span></li>

        <li>
            <span id="pinta">Pinta-me</span>
            <button class="color" data-color="red">Red</button>
            <button class="color" data-color="green">Green</button>
            <button class="color" data-color="blue">Blue</button>
        </li>

        <li>Experimenta escrever... <input id="texto" type="text" onkeyup="mudaCorInput()"></li>

        <li>
            Escolha uma cor:
            <select id="corFundo">
                <option value="white">White</option>
                <option value="lightyellow">Yellow</option>
                <option value="lightblue">Blue</option>
                <option value="lavender">Lavender</option>
            </select>
        </li>

        <li><button onclick="conta()">Conta!</button> <span id="contador">0</span></li>

        <li>
            <form id="formUser">
                <input id="nome" type="text" placeholder="insira o seu nome" required>
                <input id="idade" type="number" placeholder="idade" required>
                <input type="submit">
            </form>
            <p id="mensagem"></p>
        </li>

        <li>Automatic Counter: <span id="auto">0</span></li>
    </ol>

    <h2>Flex</h2>
    
    <select id="direcao">
        <option value="row">row</option>
        <option value="row-reverse">row-reverse</option>
        <option value="column">line</option>
        <option value="column-reverse">line-reverse</option>
    </select>

    <div id="caixa">
        <span class="bola"></span>
        <span class="bola"></span>
        <span class="bola"></span>
        <span class="bola"></span>
    </div>

    <h2>Contador com localStorage</h2>
    <p>
        <button id="dec">-</button>
        <span id="valor">0</span>
        <button id="inc">+</button>
        <button id="reset">Reset</button>
    </p>

    <script defer src="scripts/main.js"></script>
</body>
</html>
